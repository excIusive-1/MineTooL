{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Калькулятор координат Nether</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
        Перевод координат между Обычным миром (Overworld) и Незером (Nether).
    </p>

    <h3>Обычный мир ➔ Nether</h3>
    <div class="flex-gap">
        <div>
            <label>Overworld X:</label>
            <input type="number" id="overworldX" placeholder="0" oninput="calculateNether('ow')">
        </div>
        <div>
            <label>Overworld Z:</label>
            <input type="number" id="overworldZ" placeholder="0" oninput="calculateNether('ow')">
        </div>
    </div>

    <h3>Nether ➔ Обычный мир</h3>
    <div class="flex-gap">
        <div>
            <label>Nether X:</label>
            <input type="number" id="netherX" placeholder="0" oninput="calculateNether('nether')">
        </div>
        <div>
            <label>Nether Z:</label>
            <input type="number" id="netherZ" placeholder="0" oninput="calculateNether('nether')">
        </div>
    </div>
</div>
{% endblock %}
