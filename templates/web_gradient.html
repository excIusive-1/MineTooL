{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Генератор CSS Градиента</h2>
    
    <div class="flex-gap">
        <div>
            <label>Первый цвет:</label>
            <input type="color" id="webColor1" value="#a259ff" onchange="generateWebGradient()">
        </div>
        <div>
            <label>Второй цвет:</label>
            <input type="color" id="webColor2" value="#6366f1" onchange="generateWebGradient()">
        </div>
    </div>

    <label>Угол наклона (в градусах):</label>
    <input type="number" id="angleInput" value="90" min="0" max="360" oninput="generateWebGradient()">

    <label style="margin-top:15px; display:block;">Предпросмотр:</label>
    <div class="preview-box" id="webPreview" style="height: 100px;"></div>

    <label style="margin-top:15px; display:block;">Готовый CSS код:</label>
    <input type="text" id="cssOutput" readonly>
    <button onclick="copyToClipboard('cssOutput')">Скопировать CSS</button>
</div>
{% endblock %}
