{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Создание CSS Градиента</h2>
    
    <div class="flex-gap">
        <div>
            <label>Цвет 1:</label>
            <input type="color" id="webC1" value="#7b2cbf" onchange="updateWebGradient()">
        </div>
        <div>
            <label>Цвет 2:</label>
            <input type="color" id="webC2" value="#0d1b2a" onchange="updateWebGradient()">
        </div>
        <div>
            <label>Угол (градусы):</label>
            <input type="number" id="webAngle" value="135" onchange="updateWebGradient()">
        </div>
    </div>

    <label style="margin-top:15px; display:block;">Предпросмотр:</label>
    <div id="webPreview" class="preview-box" style="height: 120px; transition: 0.3s;"></div>

    <label style="margin-top:15px; display:block;">CSS Код:</label>
    <input type="text" id="webCssCode" readonly>
    <button onclick="copyToClipboard('webCssCode')">Скопировать CSS</button>
</div>
{% endblock %}
